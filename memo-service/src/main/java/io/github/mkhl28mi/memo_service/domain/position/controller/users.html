<!DOCTYPE html>
<html th:lang="${#locale.language}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title></title>
</head>
<body>

    <div layout:fragment="content" class="mx-auto w-75 mt-3">
    	<div class="d-flex justify-content-center">
	    	<div class="card w-75 mb-5">
	    		<div class="card-body">
	    			<h5 class="card-title">Додати користувача</h5>
					<form th:action="@{/admin/users}" th:object="${userRequest}" method="post">
						<div>
						  <div class="mb-2">
						    <label for="username" class="form-label">Логін*</label>
						    <input type="text" class="form-control" th:field="*{username}" required>
						  </div>
						  <div class="mb-2">
						    <label for="password" class="form-label">Пароль*</label>
						    <input type="text" class="form-control" th:field="*{password}" required>
						  </div>
						  <div class="mb-2">
						    <label for="fullName" class="form-label">ПІБ*</label>
						    <input type="text" class="form-control" th:field="*{fullName}" required>
						  </div>
						  <div class="mb-2">
						    <label for="cell" class="form-label">Телефон*</label>
						    <input type="text" class="form-control" th:field="*{cell}" required>
						  </div>
						  <div class="mb-3 form-check">
					      	<label class="form-check-label" for="enabled">Користувач доступний</label>
						    <input type="checkbox" class="form-check-input" th:field="*{enabled}">
						  </div>
						  <div class="mb-3">
							<select th:field="*{departmentUnitId}" placeholder="Почніть вводити назву..." autocomplete="off" style="width: 100%;"></select>
						  </div>
						  <div class="mb-3">
						  	<label for="roleIds" class="form-label">Ролі:</label>
				            <select th:field="*{roleIds}" multiple placeholder="Оберіть декілька тегів..." autocomplete="off">
				                <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}"></option>
				            </select>
						  </div>
						  <p>* - обов'язкові поля до заповнення</p>
						  <button type="submit" class="btn btn-outline-dark">Додати</button>
						</div>
					</form>
				</div>
			</div>
		</div>
		
		<table class="table border-top">
		  <thead>
		    <tr>
		      <th scope="col">#</th>
		      <th scope="col">Логін</th>
		      <th scope="col">ПІБ</th>
		      <th scope="col">Телефон</th>
		      <th scope="col">Доступний</th>
		      <th scope="col">Посада</th>
		      <th scope="col">Дата створення</th>
		      <th scope="col">Дата оновлення</th>
		      <th scope="col">Ролі</th>
		      <th scope="col">Дія</th>
		    </tr>
		  </thead>
		  <tbody>
		    <tr th:each="user, iterStat : ${users}">
		      <td th:text="${iterStat.count}"></td>
		      <td th:text="${user.username}"></td>
		      <td th:text="${user.fullName}"></td>
		      <td th:text="${user.cell}"></td>
		      <td th:text="${user.enabled} ? '🮱'"></td>
		      <td th:text="${user.departmentUnitResponse.departmentResponse.name}"></td>
		      <td th:text="${user.createdAt}"></td>
		      <td th:text="${user.updatedAt}"></td>
		      <td>
			      <ul class="list-group">
					  <li class="list-group-item" th:each="role : ${user.roleRespones}" th:text="${role.name}"></li>
				  </ul>
		      </td>
		      <td>
		      	<div class="d-grid mb-1">
		        	<a class="btn btn-outline-dark btn-sm" th:href="@{/admin/users/{id}(id=${user.id})}" role="button">Редагувати</a>
			    </div>
		      	<form th:action="@{/admin/users/{id}(id=${user.id})}" th:method="delete">
					<div class="d-grid">
						<button type="submit" class="btn btn-outline-danger btn-sm">Видалити</button>
					</div>
				</form>
		      </td>
		    </tr>
		  </tbody>
		</table>
    </div>
    
    <th:block layout:fragment="scripts">
   		<script>
			new TomSelect("#departmentUnitId", {
				plugins: ['remove_button'],
			    valueField: 'id',
			    labelField: 'departmentUnitLabel',
			    searchField: [],
			    
			    load: function(query, callback) {
			        if (!query.length) return callback();
					
			        const url = '/api/v1/admin/users/enabled-department-units?q=' + encodeURIComponent(query);
			
			        fetch(url)
			            .then(response => response.json())
			            .then(json => {
			                callback(json);
			            })
			            .catch(() => {
			                callback();
			            });
			    },
			    
			    shouldLoad: function(query) {
			        return query.length >= 2;
			    }
			});
			
			new TomSelect("#roleIds", {
		        plugins: ['remove_button'],
		        maxItems: null,            
		        create: false,              
		        persist: false
		    });
   		</script>
	</th:block>
    
</body>
</html>

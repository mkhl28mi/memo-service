<!DOCTYPE html>
<html th:lang="${#locale.language}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title></title>
</head>
<body>

    <div layout:fragment="content" class="mx-auto w-75 mt-3">
    	<div class="d-flex justify-content-center">
	    	<div class="card w-75 mb-5">
	    		<div class="card-body">
	    			<h5 class="card-title">Додати керівника до відділа</h5>
					<form th:action="@{/admin/application-settings/department-managers}" th:object="${departmentManagerRequest}" method="post">
						<div>
						  <div class="mb-3">
							<select th:field="*{departmentId}" placeholder="Почніть вводити назву..." autocomplete="off" style="width: 100%;"></select>
						  </div>
						  <div class="mb-3">
							<select th:field="*{employeeId}" placeholder="Почніть вводити назву..." autocomplete="off" style="width: 100%;"></select>
						  </div>
						  <p>* - обов'язкові поля до заповнення</p>
						  <button type="submit" class="btn btn-outline-dark">Додати</button>
						</div>
					</form>
				</div>
			</div>
		</div>
		
		<table class="table border-top">
		  <thead>
		    <tr>
		      <th scope="col">#</th>
		      <th scope="col">ПІБ</th>
		      <th scope="col">Посада</th>
		      <th scope="col">Відділ</th>
		      <th scope="col">Дія</th>
		    </tr>
		  </thead>
		  <tbody>
		    <tr th:each="departmentManager, iterStat : ${departmentManagers}">
		      <td th:text="${iterStat.count}"></td>
		      <td th:text="${departmentManager.fullName}"></td>
		      <td th:text="${departmentManager.position}"></td>
		      <td th:text="${departmentManager.department}"></td>
		      <td>
		      	<form th:action="@{/admin/application-settings/department-managers}" th:method="delete">
		      		<input type="hidden" name="departmentId" th:value="${departmentManager.departmentId}" />
		      		<input type="hidden" name="employeeId" th:value="${departmentManager.employeeId}" />
					<div class="d-grid">
						<button type="submit" class="btn btn-outline-danger btn-sm">Видалити</button>
					</div>
				</form>
		      </td>
		    </tr>
		  </tbody>
		</table>
    </div>
    
    <th:block layout:fragment="scripts">
   		<script>
			new TomSelect("#departmentId", {
			    valueField: 'id',
			    labelField: 'departmentLabel',
			    searchField: [],
			    
			    load: function(query, callback) {
			        if (!query.length) return callback();
			
			        const url = '/api/v1/admin/departments/search?q=' + encodeURIComponent(query);
			
			        fetch(url)
			            .then(response => response.json())
			            .then(json => {
			                callback(json);
			            })
			            .catch(() => {
			                callback();
			            });
			    },
			    
			    shouldLoad: function(query) {
			        return query.length >= 2;
			    }
			});
			
			new TomSelect("#employeeId", {
			    valueField: 'id',
			    labelField: 'fullName',
			    searchField: [],
			    
			    load: function(query, callback) {
			        if (!query.length) return callback();
			
			        const url = '/api/v1/admin/employees/search?q=' + encodeURIComponent(query);
			
			        fetch(url)
			            .then(response => response.json())
			            .then(json => {
			                callback(json);
			            })
			            .catch(() => {
			                callback();
			            });
			    },
			    
			    shouldLoad: function(query) {
			        return query.length >= 2;
			    }
			});
   		</script>
	</th:block>
	  
</body>
</html>

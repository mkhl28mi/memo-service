<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout}">
<head>
<title></title>
</head>
<body>

	<div layout:fragment="content" class="mx-auto w-75 mt-3 h-100">
		<a class="btn btn-outline-dark mb-3" href="/admin/application-settings" role="button">🡨</a>
		<div class="d-flex justify-content-center">
			<div class="card w-100 mb-5">
				<div class="card-body">
					<h5 class="card-title">Про компанію</h5>
					<form th:action="@{/admin/application-settings/about-company}" th:object="${aboutCompanyRequest}" th:method="put">
						<label for="name" class="form-label">Назва*</label> 
						<div class="input-group mb-2">
							<input type="text" class="form-control" th:field="*{name}" required>
						</div>
						<p>* - обов'язкові поля до заповнення</p>
						<button type="submit" class="btn btn-outline-dark">Зберегти</button>
					</form>
				</div>
			</div>
		</div>
	</div>
	
</body>
</html>

<!DOCTYPE html>
<html th:lang="${#locale.language}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title></title>
</head>
<body>

    <div layout:fragment="content" class="mx-auto w-75 mt-3">
    	<div class="d-flex justify-content-center">
	    	<div class="card w-75 mb-5">
	    		<div class="card-body">
	    			<h5 class="card-title">Створити працівника</h5>
					<form th:action="@{/admin/employees}" th:object="${employeeRequest}" method="post">
						<div>
						  <div class="mb-2">
						    <label for="fullName" class="form-label">ПІБ*</label>
						    <input type="text" class="form-control" th:field="*{fullName}" required>
						  </div>
						  <div class="mb-2">
						    <label for="targetFullName" class="form-label">ПІБ*</label>
						    <input type="text" class="form-control" th:field="*{targetFullName}" required>
						  </div>
						  <div class="mb-3">
							<select th:field="*{employeePositionIds}" multiple placeholder="Почніть вводити назву..." autocomplete="off" style="width: 100%;"></select>
						  </div>
						  <p>* - обов'язкові поля до заповнення</p>
						  <button type="submit" class="btn btn-outline-dark">Створити</button>
						</div>
					</form>
				</div>
			</div>
		</div>
		
		<table class="table border-top">
		  <thead>
		    <tr>
		      <th scope="col">#</th>
		      <th scope="col">ПІБ</th>
		      <th scope="col">ПІБ</th>
		      <th scope="col">Посада</th>
		      <th scope="col">Дата створення</th>
		      <th scope="col">Дія</th>
		    </tr>
		  </thead>
		  <tbody>
		    <tr th:each="employee, iterStat : ${employees}">
		      <td th:text="${iterStat.count}"></td>
		      <td th:text="${employee.fullName}"></td>
		      <td th:text="${employee.targetFullName}"></td>
		      <td th:text="${employee.employeePositionResponse.name}"></td>
		      <td th:text="${employee.createdAt}"></td>
		      <td>
		      	<div class="d-grid mb-1">
		        	<a class="btn btn-outline-dark btn-sm" th:href="@{/admin/employees/{id}(id=${employee.id})}" role="button">Редагувати</a>
			    </div>
		      	<form th:action="@{/admin/employees/{id}(id=${employee.id})}" th:method="delete">
					<div class="d-grid">
						<button type="submit" class="btn btn-outline-danger btn-sm">Видалити</button>
					</div>
				</form>
		      </td>
		    </tr>
		  </tbody>
		</table>
    </div>
    
    <th:block layout:fragment="scripts">
   		<script>
			new TomSelect("#employeePositionIds", {
			    valueField: 'id',
			    labelField: 'name',
			    searchField: [],
			    
			    load: function(query, callback) {
			        if (!query.length) return callback();
			
			        const url = '/api/v1/admin/employees/positions/search?q=' + encodeURIComponent(query);
			
			        fetch(url)
			            .then(response => response.json())
			            .then(json => {
			                callback(json);
			            })
			            .catch(() => {
			                callback();
			            });
			    },
			    
			    shouldLoad: function(query) {
			        return query.length >= 2;
			    }
			});
   		</script>
	</th:block>
	  
</body>
</html>

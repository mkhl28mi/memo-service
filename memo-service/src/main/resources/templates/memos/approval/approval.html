<!DOCTYPE html>
<html th:lang="${#locale.language}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title></title>
</head>
<body>

    <div layout:fragment="content" class="mx-auto w-75 mt-3 vh-100">
		<div th:each="memo : ${memos}" class="card mt-3 mb-3 border-dark">
			<div class="card-header">
				<div class="d-flex justify-content-between">
					<div>
						<div th:text="${memo.getMemoNumberPattern()}" class="fw-bold fs-6"></div>
						<div class="text-dark"><small th:text="${#temporals.format(memo.createdAt, 'dd-MM-yyyy HH:mm')}"></small></div>
					</div>
					<div class="ps-5 pe-5 flex-fill">
						<div class="fw-bold fs-6">Кому:</div>
						<div class="overflow-auto w-100" style="height: 60px;">
							<div th:each="recipient, iterStat : ${memo.recipients}" class="d-flex w-100 justify-content-start">
								<small th:utext="${iterStat.count + '. ' + recipient.employeeAssignmentResponse.positionResponse.targetName + ' - ' + recipient.employeeAssignmentResponse.employeeResponse.targetFullName}"></small>
							</div>
						</div>
					</div>
					<div>
						<div class="fw-bold fs-6">Виконавець: </div>
						[[${memo.assignee.userResponse.fullName}]]
						<div class="d-flex justify-content-end mt-2">
							<div class="me-4">
								<form th:action="@{/memos/{id}/process-status (id=${memo.id})}" th:method="post">
									<div class="d-grid">
										<input type="hidden" name="status" value="REJECTED">
										<button type="submit" class="btn btn-link" onclick="return confirm('Ви дійсно хочете відхилити?');" data-toggle="tooltip" data-placement="right" title="Відхилити">
											<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="#212121" class="bi bi-x-square" viewBox="0 0 16 16">
											  <path d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"/>
											  <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
											</svg>
										</button>
									</div>
								</form>
							</div>
							<div class="me-4">
								<a th:href="@{/memos/{id}/comments/create (id=${memo.id})}" class="btn btn-link" data-toggle="tooltip" data-placement="right" title="Додати коментар">
									<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="#212121" class="bi bi-chat-square-text" viewBox="0 0 16 16">
									  <path d="M14 1a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-2.5a2 2 0 0 0-1.6.8L8 14.333 6.1 11.8a2 2 0 0 0-1.6-.8H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2.5a1 1 0 0 1 .8.4l1.9 2.533a1 1 0 0 0 1.6 0l1.9-2.533a1 1 0 0 1 .8-.4H14a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"/>
									  <path d="M3 3.5a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5M3 6a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9A.5.5 0 0 1 3 6m0 2.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5"/>
									</svg>
								</a>
							</div>
							<div>
								<form th:action="@{/memos/{id}/process-status (id=${memo.id})}" th:method="post">
									<div class="d-grid">
										<input type="hidden" name="status" value="APPROVED">
										<button type="submit" class="btn btn-link" onclick="return confirm('Ви дійсно хочете погодити?');" data-toggle="tooltip" data-placement="right" title="Погодити">
											<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="#212121" class="bi bi-check2-square" viewBox="0 0 16 16">
											  <path d="M3 14.5A1.5 1.5 0 0 1 1.5 13V3A1.5 1.5 0 0 1 3 1.5h8a.5.5 0 0 1 0 1H3a.5.5 0 0 0-.5.5v10a.5.5 0 0 0 .5.5h10a.5.5 0 0 0 .5-.5V8a.5.5 0 0 1 1 0v5a1.5 1.5 0 0 1-1.5 1.5z"/>
											  <path d="m8.354 10.354 7-7a.5.5 0 0 0-.708-.708L8 9.293 5.354 6.646a.5.5 0 1 0-.708.708l3 3a.5.5 0 0 0 .708 0"/>
											</svg>
										</button>
									</div>
								</form>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="card-body border m-1">
				<div th:utext="${#strings.replace(memo.content, '<table', '<table class=&quot;table table-bordered&quot;')}" class="overflow-auto" style="height: 50px; resize: vertical;"></div>			
			</div>
			<div class="card-footer text-body-secondary">
				<div class="d-flex w-100 justify-content-start">
					<p class="fw-bold">Мітки:&nbsp;</p>
					<p th:each="label : ${memo.labels}" th:text="${label.name + '&nbsp;'}"></p>
				</div>
  			</div>
		</div>
    </div>
    
    <th:block layout:fragment="scripts">
	    <script th:inline="javascript">
	    </script>
	</th:block>
	
</body>
</html>

<!DOCTYPE html>
<html th:lang="${#locale.language}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title></title>
</head>
<body class="min-vh-100">

    <div layout:fragment="content" class="mx-auto w-75 mt-3 mb-5 h-100">
  		<form th:action="@{/memos/{id}/comments (id=${memoId})}" th:method="post">
  			<a class="btn btn-outline-dark" href="/memos/approval"  role="button">🡨</a>
	  		<div class="d-flex justify-content-between mt-3">
	  			<p class="fs-3 fw-bold">Додати коментар</p>
				<button type="submit" class="btn btn-link" data-toggle="tooltip" data-placement="right" title="Створити">
					<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="#212121" class="bi bi-plus-square" viewBox="0 0 16 16">
					  <path d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"/>
					  <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
					</svg>
				</button>
	  		</div>
	  		<div>
	  			<div class="mt-3">
					<textarea name="content" id="content"></textarea>
				</div>
	  		</div>
		</form>
    </div>
    
    <th:block layout:fragment="scripts">
	    <script th:inline="javascript">
	      	tinymce.init({
	        	selector: '#content',
	        	promotion: false,
	    		mode: 'textareas',
	    		plugins: 'advlist lists autolink link table wordcount visualchars visualblocks insertdatetime image help fullscreen charmap nonbreaking',
	    		height: 600,
	    		toolbar: ['selectall copy  paste cut | fullscreen language',
	    			'undo redo | blocks |line fontsize fontfamily | bold italic underline | alignleft aligncenter alignright alignjustify | outdent indent nonbreaking | numlist bullist | table | charmap | removeformat'
	    			],
	    		block_formats: 'Paragraph=p;',
	    		menubar: 'edit view insert format tools help',
	    		content_style: 'body {font-family: Times New Roman; font-size: 14pt; line-height: 1;}',
	    		contextmenu: 'copy paste',
	    		setup: function(editor) {
	    			editor.on('keydown', function(e) { 
	    				if(e.keyCode == 9) {
	    					editor.execCommand("mceInsertContent", false, '<span style="margin-left:19px;">&nbsp;</span>');
	    					e.preventDefault();
	    					return false;
	    				}
	    			});
	    		},
	    		license_key: 'gpl'
	      	});
	    </script>
	</th:block>
	
</body>
</html>

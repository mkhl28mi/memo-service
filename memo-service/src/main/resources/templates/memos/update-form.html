<!DOCTYPE html>
<html th:lang="${#locale.language}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title></title>
</head>
<body>

    <div layout:fragment="content" class="mx-auto w-75 mt-3">
  		<form th:action="@{/memos/{id} (id=${memoId})}" th:object="${memoRequest}" th:method="put">
	  		<div class="d-flex justify-content-between mt-3">
	  			<div class="w-50">
					<label for="approverIds" class="form-label"><b>Мітки:</b></label>
					<select th:field="*{labels}" multiple placeholder="Почніть вводити текст..." autocomplete="off" style="width: 100%;">
						<option th:each="label : ${labels}" th:value="${label.name}" th:text="${label.name}"></option>
					</select>
				</div>
				<div>
					<button type="submit" class="btn btn-link ms-3" data-toggle="tooltip" data-placement="right" title="Зберегти">
						<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="#2d3036" class="bi bi-floppy" viewBox="0 0 16 16">
						  <path d="M11 2H9v3h2z"/>
						  <path d="M1.5 0h11.586a1.5 1.5 0 0 1 1.06.44l1.415 1.414A1.5 1.5 0 0 1 16 2.914V14.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 14.5v-13A1.5 1.5 0 0 1 1.5 0M1 1.5v13a.5.5 0 0 0 .5.5H2v-4.5A1.5 1.5 0 0 1 3.5 9h9a1.5 1.5 0 0 1 1.5 1.5V15h.5a.5.5 0 0 0 .5-.5V2.914a.5.5 0 0 0-.146-.353l-1.415-1.415A.5.5 0 0 0 13.086 1H13v4.5A1.5 1.5 0 0 1 11.5 7h-7A1.5 1.5 0 0 1 3 5.5V1H1.5a.5.5 0 0 0-.5.5m3 4a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 .5-.5V1H4zM3 15h10v-4.5a.5.5 0 0 0-.5-.5h-9a.5.5 0 0 0-.5.5z"/>
						</svg>
					</button>
					<button type="submit" class="btn btn-link" data-toggle="tooltip" data-placement="right" title="Друк">
						<svg xmlns="http://www.w3.org/2000/svg" width="55" height="55" fill="#2d3036" class="bi bi-printer" viewBox="0 0 16 16">
						  <path d="M2.5 8a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1"/>
						  <path d="M5 1a2 2 0 0 0-2 2v2H2a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1v1a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-1h1a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1V3a2 2 0 0 0-2-2zM4 3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2H4zm1 5a2 2 0 0 0-2 2v1H2a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v-1a2 2 0 0 0-2-2zm7 2v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1"/>
						</svg>
					</button>
				</div>
	  		</div>
  			<div>
	  			<div class="mt-3">
					<textarea th:field="*{content}"></textarea>
				</div>
				<div class="mt-3">
					<label for="recipientIds" class="form-label"><b>Кому:</b></label>
					<select th:field="*{recipientIds}" multiple placeholder="Почніть вводити ПІБ або посаду..." autocomplete="off" style="width: 100%;"></select>
				</div>
				<div class="mt-3">
					<label for="copyRecipientIds" class="form-label"><b>Копія:</b></label>
					<select th:field="*{copyRecipientIds}" multiple placeholder="Почніть вводити ПІБ або посаду..." autocomplete="off" style="width: 100%;"></select>
				</div>
				<div class="mt-3">
					<label for="signerIds" class="form-label"><b>Підписав:</b></label>
					<select th:field="*{signerIds}" multiple placeholder="Почніть вводити ПІБ або посаду..." autocomplete="off" style="width: 100%;"></select>
				</div>
				<div class="mt-3">
					<label for="approverIds" class="form-label"><b>Погоджую:</b></label>
					<select th:field="*{approverIds}" multiple placeholder="Почніть вводити ПІБ або посаду..." autocomplete="off" style="width: 100%;"></select>
				</div>
				<div class="mt-3">
					<label for="assigneeId" class="form-label"><b>Виконавець:</b></label>
					<select th:field="*{assigneeId}" placeholder="Почніть вводити ПІБ..." autocomplete="off" style="width: 100%;"></select>
				</div>
			</div>
		</form>
    </div>
    
    <th:block layout:fragment="scripts">
	    <script th:inline="javascript">
	      	tinymce.init({
	        	selector: '#content',
	        	promotion:false,
	        	license_key: 'gpl'
	      	});
	      	
	      	const recipients = /*[[${recipients}]]*/ [];
	        const recipientOptions = recipients.map(r => r.employeeAssignmentResponse);
	        
	        const recipientItems= /*[[${memoRequest.recipientIds}]]*/ [];
	        
			new TomSelect("#recipientIds", {
				plugins: ['remove_button'],
				options: recipientOptions,
				items: recipientItems,
			    valueField: 'id',
			    searchField: [],
			    
			    score: function(query) {
			        const search = query.toLowerCase().trim();
			        return function(item) {
			            if (!search) return 1;

			            const name = (item.employeeResponse?.targetFullName || '').toLowerCase();
			            const pos = (item.positionResponse?.targetName || '').toLowerCase();
			            
			            if (name.includes(search)) return 2;
			            if (pos.includes(search)) return 1;

			            return 0;
			        };
			    },
			    
			    render: {
			        option: function(data, escape) {
			        	const fullName = data?.employeeResponse?.targetFullName || '';
		                const position = data?.positionResponse?.targetName || '';
		                
			          	return `<div><strong>${escape(fullName)}</strong><span class="text-muted"> — ${escape(position)}</span></div>`;
			        },

			        item: function(data, escape) {
			        	const fullName = data?.employeeResponse?.targetFullName || data?.text || '';
			        	
			          	return `<div>${escape(fullName)}</div>`;
			        }
			    },
			    
			    load: function(query, callback) {
			        if (!query.length) return callback();
			        
			        const url = '/api/v1/memos/enabled-employees?q=' + encodeURIComponent(query);
			
			        fetch(url)
			            .then(response => response.json())
			            .then(json => {
			                callback(json);
			            })
			            .catch(() => {
			                callback();
			            });
			    },
			    
			    shouldLoad: function(query) {
			        return query.length >= 2;
			    }
			});
			
	      	const copyRecipients = /*[[${copyRecipients}]]*/ [];
	        const copyRecipientOptions = copyRecipients.map(r => r.employeeAssignmentResponse);
	        
	        const copyRecipientItems = /*[[${memoRequest.copyRecipientIds}]]*/ [];
			
			new TomSelect("#copyRecipientIds", {
				plugins: ['remove_button'],
				options: copyRecipientOptions,
				items: copyRecipientItems,
			    valueField: 'id',
			    searchField: [],
			    
			    score: function(query) {
			        const search = query.toLowerCase().trim();
			        return function(item) {
			            if (!search) return 1;

			            const name = (item.employeeResponse?.targetFullName || '').toLowerCase();
			            const pos = (item.positionResponse?.targetName || '').toLowerCase();
			            
			            if (name.includes(search)) return 2;
			            if (pos.includes(search)) return 1;

			            return 0;
			        };
			    },
			    
			    render: {
			        option: function(data, escape) {
			        	const fullName = data?.employeeResponse?.targetFullName || '';
		                const position = data?.positionResponse?.targetName || '';
		                
			          	return `<div><strong>${escape(fullName)}</strong><span class="text-muted"> — ${escape(position)}</span></div>`;
			        },

			        item: function(data, escape) {
			        	const fullName = data?.employeeResponse?.targetFullName || data?.text || '';
			        	
			          	return `<div>${escape(fullName)}</div>`;
			        }
			    },
			    
			    load: function(query, callback) {
			        if (!query.length) return callback();
			
			        const url = '/api/v1/memos/enabled-employees?q=' + encodeURIComponent(query);
			
			        fetch(url)
			            .then(response => response.json())
			            .then(json => {
			                callback(json);
			            })
			            .catch(() => {
			                callback();
			            });
			    },
			    
			    shouldLoad: function(query) {
			        return query.length >= 2;
			    }
			});
			
	      	const signers = /*[[${signers}]]*/ [];
	        const signerOptions = signers.map(r => r.employeeAssignmentResponse);
	        
	        const signerItems = /*[[${memoRequest.signerIds}]]*/ [];
			
			new TomSelect("#signerIds", {
				plugins: ['remove_button'],
				options: signerOptions,
				items: signerItems,
			    valueField: 'id',
			    searchField: [],
			    
			    score: function(query) {
			        const search = query.toLowerCase().trim();
			        return function(item) {
			            if (!search) return 1;

			            const name = (item.employeeResponse?.fullName || '').toLowerCase();
			            const pos = (item.positionResponse?.name || '').toLowerCase();
			            
			            if (name.includes(search)) return 2;
			            if (pos.includes(search)) return 1;

			            return 0;
			        };
			    },
			    
			    render: {
			        option: function(data, escape) {
			        	const fullName = data?.employeeResponse?.fullName || '';
		                const position = data?.positionResponse?.name || '';
		                
			          	return `<div><strong>${escape(fullName)}</strong><span class="text-muted"> — ${escape(position)}</span></div>`;
			        },

			        item: function(data, escape) {
			        	const fullName = data?.employeeResponse?.fullName || data?.text || '';
			        	
			          	return `<div>${escape(fullName)}</div>`;
			        }
			    },
			    
			    load: function(query, callback) {
			        if (!query.length) return callback();
			
			        const url = '/api/v1/memos/enabled-employees?q=' + encodeURIComponent(query);
			
			        fetch(url)
			            .then(response => response.json())
			            .then(json => {
			                callback(json);
			            })
			            .catch(() => {
			                callback();
			            });
			    },
			    
			    shouldLoad: function(query) {
			        return query.length >= 2;
			    }
			});
			
	      	const approvers = /*[[${approvers}]]*/ [];
	        const approverOptions = approvers.map(r => r.employeeAssignmentResponse);
	        
	        const approverItems = /*[[${memoRequest.approverIds}]]*/ [];
			
			new TomSelect("#approverIds", {
				plugins: ['remove_button'],
				options: approverOptions,
				items: approverItems,
			    valueField: 'id',
			    searchField: [],
			    
			    score: function(query) {
			        const search = query.toLowerCase().trim();
			        return function(item) {
			            if (!search) return 1;

			            const name = (item.employeeResponse?.fullName || '').toLowerCase();
			            const pos = (item.positionResponse?.name || '').toLowerCase();
			            
			            if (name.includes(search)) return 2;
			            if (pos.includes(search)) return 1;

			            return 0;
			        };
			    },
			    
			    render: {
			        option: function(data, escape) {
			        	const fullName = data?.employeeResponse?.fullName || '';
		                const position = data?.positionResponse?.name || '';
		                
			          	return `<div><strong>${escape(fullName)}</strong><span class="text-muted"> — ${escape(position)}</span></div>`;
			        },

			        item: function(data, escape) {
			        	const fullName = data?.employeeResponse?.fullName || data?.text || '';
			        	
			          	return `<div>${escape(fullName)}</div>`;
			        }
			    },
			    
			    load: function(query, callback) {
			        if (!query.length) return callback();
			
			        const url = '/api/v1/memos/enabled-employees?q=' + encodeURIComponent(query);
			
			        fetch(url)
			            .then(response => response.json())
			            .then(json => {
			                callback(json);
			            })
			            .catch(() => {
			                callback();
			            });
			    },
			    
			    shouldLoad: function(query) {
			        return query.length >= 2;
			    }
			});
			
	      	const assigneesOptions = /*[[${assignees}]]*/ [];
	        
	        const assigneeItems = /*[[${memoRequest.assigneeId}]]*/ [];
	        
			new TomSelect("#assigneeId", {
				plugins: ['remove_button'],
				options: assigneesOptions,
				items: assigneeItems,
			    valueField: 'id',
			    searchField: [],
			    
			    score: function(query) {
			        const search = query.toLowerCase().trim();
			        return function(item) {
			            if (!search) return 1;

			            const name = (item.userResponse?.fullName || '').toLowerCase();
			            
			            if (name.includes(search)) return 2;

			            return 0;
			        };
			    },
			    
			    render: {
			        option: function(data, escape) {
			        	const fullName = data?.userResponse?.fullName || '';
		                
			          	return `<div><strong>${escape(fullName)}</strong></div>`;
			        },

			        item: function(data, escape) {
			        	const fullName = data?.userResponse?.fullName || data?.text || '';
			        	
			          	return `<div>${escape(fullName)}</div>`;
			        }
			    },
			    
			    load: function(query, callback) {
			        if (!query.length) return callback();
			
			        const url = '/api/v1/memos/enabled-assignees?q=' + encodeURIComponent(query);
			
			        fetch(url)
			            .then(response => response.json())
			            .then(json => {
			                callback(json);
			            })
			            .catch(() => {
			                callback();
			            });
			    },
			    
			    shouldLoad: function(query) {
			        return query.length >= 2;
			    }
			});
			
			new TomSelect("#labels", {
				plugins: ['remove_button'],
			    valueField: 'value',
			    labelField: 'text',
			    create: true, 
			    createOnBlur: true,
			    searchField: [],
			    
			    load: function(query, callback) {
			        if (!query.length) return callback();
			
			        const url = '/api/v1/memos/distinct-labels?q=' + encodeURIComponent(query);
			
			        fetch(url)
			            .then(response => response.json())
			            .then(json => {
			                callback(json);
			            })
			            .catch(() => {
			                callback();
			            });
			    },
			    
			    shouldLoad: function(query) {
			        return query.length >= 2;
			    }
			});
	    </script>
	</th:block>
	
</body>
</html>

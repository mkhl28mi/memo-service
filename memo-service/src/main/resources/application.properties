spring.application.name=memo-service

spring.mvc.hiddenmethod.filter.enabled=true
spring.messages.fallback-to-system-locale=false

# Postgresql Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/memo_service_db}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${DB_SHOW_SQL:true}
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# Thymeleaf Configuration
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# File uploading Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server Configuration
server.port=${SERVER_PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEY_STORE:classpath:keystore.p12}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD}
server.ssl.key-store-type=${SSL_KEY_STORE_TYPE:PKCS12}
server.ssl.key-alias=${SSL_KEY_ALIAS:springboot}


